name: Validate SuperTux content

on:
  push:
    branches: ["main", "develop/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-level-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate level structure and tilemaps
        run: python scripts/validate_levels.py
