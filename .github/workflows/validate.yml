name: Validate SuperTux content

on:
  push:
    branches: ["main", "develop/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-level-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile scripts/*.py
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Validate level structure and cross-file references
        run: python scripts/validate_levels.py
      - name: Report UHD art readiness
        run: python scripts/uhd-audit.py
      - name: Report Level 01 UHD production status
        run: python scripts/level01-art-status.py
      - name: Check Level 01 P1 art gate when incoming assets exist
        run: |
          if find art/incoming/level01 -type f -name '*.png' | grep -q .; then
            python scripts/level01-p1-qa.py
          else
            echo "No incoming P1 PNGs yet; skipping art QA."
          fi
