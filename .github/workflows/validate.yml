name: Validate SuperTux content

on:
  push:
    branches: ["main", "develop/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-level-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile scripts/*.py
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Validate level structure and cross-file references
        run: python scripts/validate_levels.py
      - name: Report UHD art readiness
        run: python scripts/uhd-audit.py
